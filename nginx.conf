# =============================================================
# Nginx do container (EasyPanel). Serve a SPA buildada em /dist.
# Baseado no nginx.conf.example, adaptado pros caminhos do container.
#
# Obs.: no nginx, um `add_header` dentro de um `location` anula os
# `add_header` herdados do server. Por isso os headers de segurança
# são repetidos nos blocos que definem Cache-Control.
# =============================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressão
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  client_max_body_size 4M;

  # Headers de segurança (nível server — valem onde não há add_header local)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Assets com hash: cache longo (1 ano)
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Outros estáticos: cache moderado (30 dias)
  location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # index.html: nunca em cache (mas mantém os headers de segurança)
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
  }

  # SPA fallback: qualquer rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bloqueia arquivos sensíveis
  location ~ /\.(?!well-known) {
    deny all;
  }
}
